    <style>
      html,body,#root{height:100%;margin:0;background:#17181c;}
      .splash{position:fixed;inset:0;background:#17181c;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:9999;transition:opacity .8s ease;}
      .splash.fade-out{opacity:0;pointer-events:none;}
      .splash-seal{width:120px;height:120px;border:2px solid #c9a86a;border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:24px;animation:sealDrop .6s ease-out both;}
      .splash-seal span{font-family:'STKaiti','KaiTi','Kaiti SC',serif;font-size:56px;color:#c9a86a;}
      .splash-text{color:#c9a86a;font-family:'STKaiti','KaiTi','Kaiti SC',serif;font-size:20px;letter-spacing:.4em;opacity:0;animation:inkIn .8s .3s forwards;}
      .splash-sub{color:#a89f8a;font-size:12px;margin-top:8px;opacity:0;animation:inkIn .8s .8s forwards;}
      @keyframes sealDrop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.05)}100%{transform:scale(1);opacity:1}}
      @keyframes inkIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    </style>

ce",trace:{strokes:[[{x:50,y:18},{x:50,y:66}],[{x:50,y:24},{x:72,y:24}],[{x:50,y:38},{x:72,y:38}],[{x:50,y:52},{x:72,y:52}]]},links:[{to:"zhu",rel:"竹毛相合 · 会意为「笔」"}]},{id:"xiang",char:"香",pinyin:"xiāng",tagline:"炉烟袅袅长",etymology:"会意字。甲骨文从「黍」从「火」：上方是黍米，下方是灶火，火烧黍米而生香气。宋人焚香点茶，园林亭台常置一炉，香烟袅袅，是文人日常。本义为香气。",shuowen:"香，芳也。从黍从火。",sources:["《说文解字·香部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<line x1='50' y1='20' x2='50' y2='50' class='g-stroke'/><rect x='35' y='50' width='30' height='20' class='g-stroke'/><path class='g-stroke' d='M42 44 L42 40'/><path class='g-stroke' d='M58 44 L58 40'/>"},{era:"seal",label:"小篆（示意）",svg:"<line x1='50' y1='22' x2='50' y2='52' class='g-stroke'/><rect x='36' y='52' width='28' height='18' class='g-stroke'/><path class='g-stroke' d='M43 46 L43 42'/><path class='g-stroke' d='M57 46 L57 42'/>"},{era:"modern",label:"楷书",modernChar:"香"}],puzzleType:"trace",trace:{strokes:[[{x:50,y:20},{x:50,y:50}],[{x:35,y:50},{x:65,y:50},{x:65,y:70},{x:35,y:70},{x:35,y:50}],[{x:42,y:44},{x:42,y:40}],[{x:58,y:44},{x:58,y:40}]]},links:[]}],b0=[{id:"zhu-mao-bi",from:"zhu",to:"mao",rel:"竹毛相合 · 会意为「笔」",kind:"compose"},{id:"si-si-su",from:"si",to:"si",rel:"双丝并置 · 会意为「素」",kind:"compose"}],Fn=[{id:"bi",parts:["竹","毛"],partIds:["zhu","mao"],result:"笔",meaning:"竹管为杆，毛为笔头，合为书写之器，会意为「笔」——宋人以笔墨为日课，一管在手，万虑皆空。",linkId:"zhu-mao-bi",partEras:["宋明","宋明"]},{id:"su",parts:["丝","丝"],partIds:["si","si"],result:"素",meaning:"双丝并置，本义为未染之丝，会意为「素」——素净无饰，也是书画的起点：白纸一张，方见笔墨。",linkId:"si-si-su",partEras:["宋明","宋明"]}],U0={zhu:[25,30],jade:[70,28],si:[45,22],quan:[75,60],mao:[20,65],xiang:[50,72]},Q0=[50,45],mt=[{id:"gong",char:"工",pinyin:"gōng",tagline:"巧思出匠人",etymology:"象形字。甲骨文象工匠使用的曲尺之形：一竖一横成 L 形，即「工」字最早的样貌。工是规矩，是法度，是把构想化为实物的手艺。本义为工巧、工匠。",shuowen:"工，巧饰也。象人有规矩也。",sources:["《说文解字·工部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<path class='g-stroke' d='M25 72 L25 40 L75 40'/>"},{era:"seal",label:"小篆（示意）",svg:"<path class='g-stroke' d='M28 72 L28 42 L72 42'/>"},{era:"modern",label:"楷书",modernChar:"工"}],puzzleType:"trace",trace:{strokes:[[{x:25,y:72},{x:25,y:40}],[{x:25,y:40},{x:75,y:40}]]},links:[{to:"li",rel:"工力相合 · 会意为「功」"}]},{id:"li",char:"力",pinyin:"lì",tagline:"筋骨有余力",etymology:"象形字。甲骨文象手臂肌肉隆起之形，中间一竖是筋脉，两侧是绷起的肌腹。力由筋生，人持重物则力现。本义为力量、筋力。",shuowen:"力，筋也。象人筋形。",sources:["《说文解字·力部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<line x1='50' y1='18' x2='50' y2='70' class='g-stroke'/><path class='g-stroke' d='M50 30 L24 66'/><path class='g-stroke' d='M50 44 L74 58'/>"},{era:"seal",label:"小篆（示意）",svg:"<line x1='50' y1='20' x2='50' y2='68' class='g-stroke'/><path class='g-stroke' d='M50 32 L26 64'/><path class='g-stroke' d='M50 46 L72 56'/>"},{era:"modern",label:"楷书",modernChar:"力"}],puzzleType:"trace",trace:{strokes:[[{x:50,y:18},{x:50,y:70}],[{x:50,y:30},{x:24,y:66}],[{x:50,y:44},{x:74,y:58}]]},links:[{to:"gong",rel:"工力相合 · 会意为「功」"}]},{id:"fei",char:"飞",pinyin:"fēi",tagline:"垂天之翼",etymology:"象形字。甲骨文「飛」字画的是一只展翅的鸟：中间是鸟身，两侧是大张的羽翼。飞是鸟的本能，也是人自古的向往——从风筝到飞机，飞字始终牵着那片天。本义为飞翔。",shuowen:"飛，鸟翥也。从飞而羽不见。",sources:["《说文解字·飞部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<path class='g-stroke' d='M50 50 Q30 20 22 28'/><path class='g-stroke' d='M50 50 Q70 20 78 28'/><line x1='50' y1='50' x2='50' y2='70' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<path class='g-stroke' d='M50 52 Q32 24 24 30'/><path class='g-stroke' d='M50 52 Q68 24 76 30'/><line x1='50' y1='52' x2='50' y2='72' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"飞"}],puzzleType:"trace",trace:{strokes:[[{x:50,y:50},{x:30,y:20},{x:22,y:28}],[{x:50,y:50},{x:70,y:20},{x:78,y:28}],[{x:50,y:50},{x:50,y:70}]]},links:[]},{id:"che",char:"车",pinyin:"chē",tagline:"轮转千里途",etymology:"象形字。甲骨文是俯视的双轮马车：两个圆轮，中间是车舆（车厢），上方是车辕。车是古代最重要的交通工具，今日更化为高铁与千里之行。本义为车辆。",shuowen:"車，輿輪之總名。象形。",sources:["《说文解字·车部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<circle cx='30' cy='62' r='14' class='g-stroke'/><circle cx='70' cy='62' r='14' class='g-stroke'/><line x1='30' y1='62' x2='70' y2='62' class='g-stroke'/><line x1='50' y1='20' x2='50' y2='62' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<circle cx='32' cy='64' r='12' class='g-stroke'/><circle cx='68' cy='64' r='12' class='g-stroke'/><line x1='32' y1='64' x2='68' y2='64' class='g-stroke'/><line x1='50' y1='22' x2='50' y2='64' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"车"}],puzzleType:"trace",trace:{strokes:[[{x:30,y:62},{x:16,y:62},{x:30,y:76},{x:44,y:62},{x:30,y:48},{x:30,y:62}],[{x:70,y:62},{x:56,y:62},{x:70,y:76},{x:84,y:62},{x:70,y:48},{x:70,y:62}],[{x:30,y:62},{x:70,y:62}],[{x:50,y:20},{x:50,y:62}]]},links:[]},{id:"wang",char:"网",pinyin:"wǎng",tagline:"万象入网罗",etymology:"象形字。甲骨文象一张交叉的网格之形，横竖相织，用来捕鱼猎兽。今日「网」已从渔网走向互联网——万物流通，尽在一网之中。本义为网罗。",shuowen:"網，庖犧所結繩以漁。從冂，下象網交文。",sources:["《说文解字·网部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<path class='g-stroke' d='M20 20 L20 80 L80 80 L80 20 L20 20'/><line x1='20' y1='50' x2='80' y2='50' class='g-stroke'/><line x1='50' y1='20' x2='50' y2='80' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<path class='g-stroke' d='M22 22 L22 78 L78 78 L78 22 L22 22'/><line x1='22' y1='50' x2='78' y2='50' class='g-stroke'/><line x1='50' y1='22' x2='50' y2='78' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"网"}],puzzleType:"trace",trace:{strokes:[[{x:20,y:20},{x:20,y:80},{x:80,y:80},{x:80,y:20},{x:20,y:20}],[{x:20,y:50},{x:80,y:50}],[{x:50,y:20},{x:50,y:80}]]},links:[]},{id:"jin",char:"金",pinyin:"jīn",tagline:"百炼始成器",etymology:"象形字。甲骨文象一块金属锭之形：下方是箭镞状的锋刃，上方是提柄的孔，整体如俯视的箭镞。金经百炼方成器，是工艺也是工业。本义为金属、金石。",shuowen:"金，五色金也。象形。",sources:["《说文解字·金部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<path class='g-stroke' d='M50 18 L30 50 L50 64 L70 50 L50 18 Z'/><line x1='50' y1='18' x2='50' y2='70' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<path class='g-stroke' d='M50 20 L32 50 L50 64 L68 50 L50 20 Z'/><line x1='50' y1='20' x2='50' y2='68' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"金"}],puzzleType:"trace",trace:{strokes:[[{x:50,y:18},{x:30,y:50},{x:50,y:64},{x:70,y:50},{x:50,y:18}],[{x:50,y:18},{x:50,y:70}]]},links:[]},{id:"wei",char:"囗",pinyin:"wéi",tagline:"四面皆守护",etymology:"象形字。甲骨文是一个封闭的方框，象城邑的围垣之形。囗是边界，是范围，是把珍宝护在中间的那道墙。近现代讲非遗传承，守护的正是这些「国宝」。本义为城围、环绕。",shuowen:"囗，回也。象回匝之形。",sources:["《说文解字·囗部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<rect x='25' y='25' width='50' height='50' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<rect x='27' y='27' width='46' height='46' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"囗"}],puzzleType:"trace",trace:{strokes:[[{x:25,y:25},{x:25,y:75},{x:75,y:75}],[{x:25,y:25},{x:75,y:25},{x:75,y:75}]]},links:[{to:"jade",rel:"囗玉相合 · 会意为「国」"}]},{id:"shi",char:"石",pinyin:"shí",tagline:"山骨立千秋",etymology:"象形字。甲骨文上方是山崖之形（厂），下方是石落之形，合起来象山崖下有石。石是山的骨头，是建筑的基，也是现代工业的原料。本义为石头。",shuowen:"石，山骨也。象形。",sources:["《说文解字·石部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<path class='g-stroke' d='M22 22 L50 22 L78 40 L70 78 L30 78 L22 50 Z'/><line x1='40' y1='48' x2='64' y2='48' class='g-stroke'/><line x1='40' y1='58' x2='64' y2='58' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<path class='g-stroke' d='M24 24 L50 24 L76 40 L68 76 L32 76 L24 50 Z'/><line x1='42' y1='48' x2='62' y2='48' class='g-stroke'/><line x1='42' y1='58' x2='62' y2='58' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"石"}],puzzleType:"trace",trace:{strokes:[[{x:22,y:22},{x:50,y:22},{x:78,y:40},{x:70,y:78},{x:30,y:78},{x:22,y:50},{x:22,y:22}],[{x:40,y:48},{x:64,y:48}],[{x:40,y:58},{x:64,y:58}]]},links:[{to:"ma",rel:"石马相合 · 会意为「码」"}]},{id:"shi10",char:"十",pinyin:"shí",tagline:"规矩出方圆",etymology:"象形字。甲骨文是一纵一横的交叉，象织布机上经纬相交之形，亦象 measures 之交。十是数之满，也是规矩的原点——无规矩不成方圆。本义为十、交叉。",shuowen:"十，數之終也。象形。",sources:["《说文解字·十部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<line x1='50' y1='20' x2='50' y2='80' class='g-stroke'/><line x1='28' y1='50' x2='72' y2='50' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<line x1='50' y1='22' x2='50' y2='78' class='g-stroke'/><line x1='30' y1='50' x2='70' y2='50' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"十"}],puzzleType:"trace",trace:{strokes:[[{x:50,y:20},{x:50,y:80}],[{x:28,y:50},{x:72,y:50}]]},links:[{to:"jin",rel:"金十相合 · 会意为「针」"}]},{id:"dong",char:"东",pinyin:"dōng",tagline:"日出之方",etymology:"象形字。甲骨文象一个装满东西的囊袋，两端有束口的绳。后借为东方之东——日出之处，万物始动。近现代讲「东西」，此字已是日常最熟稔的一个方向。本义为东方。",shuowen:"东，動也。从木，官溥说从木，在日中。",sources:["《说文解字·东部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<path class='g-stroke' d='M50 20 Q30 30 30 50 Q30 70 50 80 Q70 70 70 50 Q70 30 50 20 Z'/><line x1='38' y1='38' x2='30' y2='30' class='g-stroke'/><line x1='62' y1='38' x2='70' y2='30' class='g-stroke'/><line x1='38' y1='62' x2='30' y2='72' class='g-stroke'/><line x1='62' y1='62' x2='70' y2='72' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<path class='g-stroke' d='M50 22 Q32 32 32 50 Q32 68 50 78 Q68 68 68 50 Q68 32 50 22 Z'/><line x1='40' y1='40' x2='32' y2='32' class='g-stroke'/><line x1='60' y1='40' x2='68' y2='32' class='g-stroke'/><line x1='40' y1='60' x2='32' y2='70' class='g-stroke'/><line x1='60' y1='60' x2='68' y2='70' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"东"}],puzzleType:"trace",trace:{strokes:[[{x:50,y:20},{x:30,y:30},{x:30,y:50},{x:30,y:70},{x:50,y:80},{x:70,y:70},{x:70,y:50},{x:70,y:30},{x:50,y:20}],[{x:38,y:38},{x:30,y:30}],[{x:62,y:38},{x:70,y:30}],[{x:38,y:62},{x:30,y:72}],[{x:62,y:62},{x:70,y:72}]]},links:[]},{id:"xi",char:"西",pinyin:"xī",tagline:"归鸟入林",etymology:"象形字。甲骨文象一只栖息的鸟之形：中间是鸟身，上方是首与翼。西原是「栖」的本字，后借为西方——日落之处，归鸟入林。近现代「东西」并称，此字是那半个日常。本义为西方。",shuowen:"西，鳥在巢上。象形。",sources:["《说文解字·西部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<path class='g-stroke' d='M30 30 Q50 20 70 30 L70 50 Q70 65 50 72 Q30 65 30 50 Z'/><line x1='40' y1='40' x2='60' y2='40' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<path class='g-stroke' d='M32 32 Q50 22 68 32 L68 50 Q68 64 50 70 Q32 64 32 50 Z'/><line x1='42' y1='42' x2='58' y2='42' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"西"}],puzzleType:"trace",trace:{strokes:[[{x:30,y:30},{x:50,y:20},{x:70,y:30},{x:70,y:50},{x:50,y:72},{x:30,y:50},{x:30,y:30}],[{x:40,y:40},{x:60,y:40}]]},links:[]},{id:"zhong",char:"中",pinyin:"zhòng",tagline:"不偏即是中",etymology:"象形字。甲骨文是一面旗（或测天之表）立于中央，以「口」示范围，「丨」为直立之杆，合为「中」——不偏不倚，恰在当中。中华之「中」，是位置也是德行。本义为中间、中央。",shuowen:"中，内也。象形。",sources:["《说文解字·中部》","古字形：公版资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<line x1='50' y1='18' x2='50' y2='82' class='g-stroke'/><rect x='30' y='30' width='40' height='28' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<line x1='50' y1='20' x2='50' y2='80' class='g-stroke'/><rect x='32' y='32' width='36' height='26' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"中"}],puzzleType:"trace",trace:{strokes:[[{x:50,y:18},{x:50,y:82}],[{x:30,y:30},{x:70,y:30},{x:70,y:58},{x:30,y:58},{x:30,y:30}]]},links:[]}],B0=[{id:"gong-li-gong",from:"gong",to:"li",rel:"工力相合 · 会意为「功」",kind:"compose"},{id:"wei-jade-guo",from:"wei",to:"jade",rel:"囗玉相合 · 会意为「国」",kind:"compose"},{id:"shi-ma-ma",from:"shi",to:"ma",rel:"石马相合 · 会意为「码」",kind:"compose"},{id:"jin-shi10-zhen",from:"jin",to:"shi10",rel:"金十相合 · 会意为「针」",kind:"compose"},{id:"wei-mu-kun",from:"wei",to:"mu",rel:"囗木相合 · 会意为「困」",kind:"compose"}],Dn=[{id:"gong",parts:["工","力"],partIds:["gong","li"],result:"功",meaning:"工为工巧之器，力为筋力，工力相合乃成事，会意为「功」——功夫、功效、功业。",linkId:"gong-li-gong",partEras:["近现代","近现代"]},{id:"guo",parts:["囗","玉"],partIds:["wei","jade"],result:"国",meaning:"囗为疆域环绕，玉为珍宝，疆土之内自有珍宝守护，会意为「国」——近现代讲非遗传承，守护的正是这些「国宝」。",linkId:"wei-jade-guo",partEras:["近现代","宋明"]},{id:"ma",parts:["石","马"],partIds:["shi","ma"],result:"码",meaning:"石为基石，马为马力，石马相合而成「码」——码头、码字，是计量也是落脚之处。",linkId:"shi-ma-ma",partEras:["近现代","汉唐"]},{id:"zhen",parts:["金","十"],partIds:["jin","shi10"],result:"针",meaning:"金为金属之材，十为十全之数，金十相合而成「针」——细物亦需精工，是匠人手上那根看不见的线。",linkId:"jin-shi10-zhen",partEras:["近现代","近现代"]},{id:"kun",parts:["囗","木"],partIds:["wei","mu"],result:"困",meaning:"囗为四面围合，木为林木，围木而成「困」——困顿、困境，亦是围炉共度的那一段时光。",linkId:"wei-mu-kun",partEras:["近现代","先秦"]}],W0={fei:[50,16],li:[72,28],che:[86,48],jin:[50,84],wang:[16,68],gong:[16,32],wei:[36,52],shi:[24,44],dong:[60,24],xi:[78,40],zhong:[44,60],shi10:[68,72]},H0=[50,46],V0=[{x:78,y:50},{x:77.1,y:57.3},{x:74.2,y:64},{x:69.8,y:69.8},{x:64,y:74.2},{x:57.3,y:77.1},{x:50,y:78},{x:42.7,y:77.1},{x:35.8,y:74.2},{x:30.2,y:69.8},{x:25.8,y:64},{x:22.9,y:57.3},{x:22,y:50},{x:22.9,y:42.7},{x:25.8,y:36},{x:30.2,y:30.2},{x:35.8,y:25.8},{x:42.7,y:22.9},{x:50,y:22},{x:57.3,y:22.9},{x:64,y:25.8},{x:69.8,y:30.2},{x:74.2,y:35.8},{x:77.1,y:42.7},{x:78,y:50}],Ae=[{id:"ri",char:"日",pinyin:"rì",tagline:"太阳之精",etymology:"象形字。甲骨文作圆形轮廓、中有一点（或短横），摹画太阳之形；圆中加点是为了与「口」等其他圆形符号相区别。本义为太阳、白昼。",shuowen:"實也。太陽之精不虧。从囗一。象形。",sources:["《说文解字·日部》","古字形：公版甲骨资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<circle cx='50' cy='50' r='28' class='g-stroke'/><circle cx='50' cy='50' r='5' class='g-fill'/>"},{era:"seal",label:"小篆（示意）",svg:"<rect x='28' y='20' width='44' height='60' rx='12' class='g-stroke'/><line x1='38' y1='50' x2='62' y2='50' class='g-stroke'/>"},{era:"modern",label:"楷书",modernChar:"日"}],puzzleType:"trace",trace:{strokes:[V0,[{x:50,y:49.5},{x:50.5,y:50.5}]]},links:[{to:"yue",rel:"日月相配"}]},{id:"yue",char:"月",pinyin:"yuè",tagline:"太阴之精",etymology:"象形字。甲骨文作弯月（弦月）之形，中加一笔以示月中阴影。月亮时缺时圆，古人取其常见之弯月造型，与圆满的「日」相对。本义为月亮。",shuowen:"闕也。大陰之精。象形。",sources:["《说文解字·月部》","古字形：公版甲骨资料 · 本项目示意重绘"],forms:[{era:"oracle",label:"甲骨文",svg:"<path class='g-stroke' d='M66.5 21.4 L50 17 L33.5 21.4 L21.4 33.5 L17 50 L21.4 66.5 L33.5 78.6 L50 83 L66.5 78.6 L66.6 78.5 L52.4 78.3 L39.3 70.7 L31.7 57.6 L31.7 42.4 L39.3 29.3 L52.4 21.7 L66.6 21.5 Z'/><line x1='57' y1='40' x2='57' y2='58' class='g-stroke'/>"},{era:"seal",label:"小篆（示意）",svg:"<path class='g-stroke' d='M62 12 C30 30 30 70 62 88'/><path class='g-stroke' d='M62 12 C48 30 48 70 62 88'/><line x1='54' y1='38' "古字形：公版甲骨资料 · 本项目示意重绘"]},shan:{title:"三峰并立",body:"甲骨文的“山”字，就像三座山峰并肩而立，中间一座高耸，两侧略低，底部相连，仿佛山体扎根大地。它的本义就是山峰。你看那起伏的轮廓，是不是也像大地呼吸的脊梁？古人见山而敬，山不仅是风景，更是安稳与永恒的象征。",sources:["《说文解字·山部》","古字形：公版甲骨资料 · 本项目示意重绘"]},shui:{title:"流水之形",body:"甲骨文里，“水”字像一条蜿蜒的河流，中间是奔流的水势，两侧的小点像溅起的水花或水滴。它最初指河里的水，后来泛指一切水流。《说文解字》说：“準也。北方之行。象眾水並流，中有微陽之氣也。”意思是水是平准的，属北方，像众多水流并行，其中含有微弱的阳气。看到这个字，仿佛能听见溪水潺潺，感受到生命之源在天地间静静流淌。",sources:["《说文解字·水部》","古字形：公版甲骨资料 · 本项目示意重绘"]},mu:{title:"木之生息",body:"古文字里，“木”是一棵树的速写：中央一笔是挺拔的树干，向上分出枝丫，向下生出根须，枝与根遥遥呼应，仿佛正迎着阳光生长。它的本义就是树木。看到“木”，会让人想到森林的呼吸，以及生命从土地中破土而出的力量。",sources:["《说文解字·木部》","古字形：公版甲骨资料 · 本项目示意重绘"]},huo:{title:"炎上之火",body:"甲骨文的“火”字，像一团正在燃烧的火焰：中间起伏的轮廓是跳动的火苗，两侧的小短画是迸溅的火星。它和静止的“山”正好相反，是一股向上蹿动的力量。所以“火”的本义就是火焰。《说文》说它“炎而上”，正是火苗向上腾跃的样子。看到这个字，仿佛能感受到篝火旁的温暖，以及人类文明最初的光明。",sources:["《说文解字·火部》","古字形：公版甲骨资料 · 本项目示意重绘"]},ren:{title:"天地灵长",body:"甲骨文的“人”字，像一个侧身站立的人：一笔画出头、背和腿，另一笔是垂下的手臂。两笔就勾勒出人直立行走的姿态，简洁又传神。它的本义就是“人”，指能直立行走、有智慧的万物之灵。看着这个字，仿佛能感受到古人观察自己时的惊叹——原来我们站直了，就是天地间最特别的存在。",sources:["《说文解字·人部》","古字形：公版甲骨资料 · 本项目示意重绘"]},kou:{title:"口中含虚",body:"甲骨文的“口”描摹人张开的嘴巴，是一个中空的轮廓，与“日”不同，“日”中有一点或一横，而“口”中空无一物。本义为嘴，是说话和进食的器官。后来引申为出入口，如门口、关口，也指人口。这个简单的字形，像一扇虚掩的门，吐纳言语，也吞吐气息，让人联想到“口”是人与世界交流的窗口，也是文明传承的通道。",sources:["《说文解字·口部》","古字形：公版甲骨资料 · 本项目示意重绘"]},niu:{title:"牛角昂然",body:"古文字的“牛”字，像一幅正面的牛头简笔画：最显眼的是两侧向上弯翘的大角，中间一竖是牛脸，下方短横是耳朵。古人画牛，抓住的就是那对威风凛凛的角。所以“牛”的本义就是牛这种动物。看着这个字，仿佛能听见田野间悠长的哞叫，看见它低头吃草、抬头望天的憨厚模样。",sources:["《说文解字·牛部》","古字形：公版甲骨资料 · 本项目示意重绘"]},yu:{title:"天降甘霖",body:"古文字里，“雨”字最上面一横是天空，下面垂落的线条像云气，而那些小点就是雨滴。整个字就像一幅简笔画：乌云低垂，雨点纷纷落下。它的本义就是雨水。《说文》说“水从雲下也”，水从云里落下来，正是雨。看到这个字，仿佛能听见雨打屋檐的声音，感受到大地润泽的清新气息。",sources:["《说文解字·雨部》","古字形：公版甲骨资料 · 本项目示意重绘"]},zhou:{title:"一叶轻舟",body:"古文字的“舟”字，像一只小船的样子：船底平平的，船头和船尾微微向上翘起，中间还有一道横线，那是船舱的隔板。古人看到水上的小船，就画下它的模样，后来就成了“舟”字。它的本义就是船。想象一下，在江河上，一叶小舟轻轻漂着，载着人渡过水面，也载着古人的诗意与远方。",sources:["《说文解字·舟部》","古字形：公版资料 · 本项目示意重绘"]},ma:{title:"骏马昂首",body:"甲骨文的“马”字，像一匹昂首嘶鸣的马：上方是竖起的鬃毛，中间是马脸，下方是并列的蹄足。它本义就是马。古人造字，抓住马奔跑时的神采，让人一看便知。马是古代交通、征战的重要伙伴，也常被用来比喻人才，如“千里马”。这句“马”字，仿佛带着草原的风，让人想到骏马奔腾的豪迈。",sources:["《说文解字·马部》","古字形：公版资料 · 本项目示意重绘"]},men:{title:"门扉之启",body:"古字形画的是两扇门扉，上面有门楣，左右各一扇可以开合的门。它的本义就是门。门是家与世界的交界，推开它，便走向更广阔的天地。",sources:["《说文解字·门部》","古字形：公版资料 · 本项目示意重绘"]},tian:{title:"方田之象",body:"“田”字的古字形，就像一块被划成整齐方格的土地，四四方方，仿佛能看到田埂纵横。它的本义就是田地，人们在其中种植庄稼。想象一下，春天播种，秋天收获，一方方田里承载着丰收的希望，也藏着“粒粒皆辛苦”的珍惜。",sources:["《说文解字·田部》","古字形：公版资料 · 本项目示意重绘"]},zhu:{title:"虚心有节",body:"古字形摹画的是两片下垂的竹叶，上方叶尖对称，下方一竖是竹节延伸的茎，仿佛一株修竹在风中摇曳。它的本义就是竹子。竹子冬天不凋零，古人称它“冬生草”，又因中空有节，常用来比喻君子的谦虚与气节。看到“竹”字，仿佛能听见竹林里的风声，闻到雨后竹叶的清香。",sources:["《说文解字·竹部》","古字形：公版资料 · 本项目示意重绘"]},jade:{title:"玉德之美",body:"古时“玉”字像一根绳子串着几片玉，中间是玉身，上有孔，下有穗。它本指温润的美石。古人觉得玉有仁、智、义、礼、乐五种品德，所以常佩玉自省。想象月光下，玉透着柔和的光，像君子温和又坚定。",sources:["《说文解字·玉部》","古字形：公版资料 · 本项目示意重绘"]},si:{title:"蚕丝之象",body:"甲骨文的“丝”字，画的是两束绞在一起的丝线，左右各一束，线条弯弯绕绕，像蚕吐出的细丝缠绕成团。它的本义就是蚕丝。古人养蚕缫丝，织成绸缎，丝线柔软而坚韧，牵连不断。看到“丝”字，仿佛能听见织机咿呀，看见江南水乡的晨光里，丝线泛着柔亮的光泽，如春雨般细密绵长。",sources:["《说文解字·糸部》","古字形：公版资料 · 本项目示意重绘"]},quan:{title:"石间清涌",body:"古字形摹画的是山崖间涌出的泉水：上方几道细流从石缝中淌下，下方汇成一汪清潭。它的本义就是泉水，指从地下涌出的水流。看着这个字，仿佛能听见山涧叮咚，看见水光潋滟，让人想起园林中引泉凿池的雅趣，以及那股生生不息的清凉。",sources:["《说文解字·泉部》","古字形：公版资料 · 本项目示意重绘"]},mao:{title:"毫毛之始",body:"甲骨文的“毛”字，像一支羽毛：中间一竖是羽轴，两侧斜出的小笔是羽枝，仿佛一根根细毛从轴上生出。它的本义就是毛发、羽毛，也指兽毛。古人制笔，以兔毫、羊毫为上，笔头便取自这些细毛。看着这个字，仿佛能想到春风里轻拂的柳絮，或是鸟羽在阳光下微微颤动的光泽，万物之微，皆有生意。",sources:["《说文解字·毛部》","古字形：公版资料 · 本项目示意重绘"]},xiang:{title:"香远益清",body:"香字，古字形摹画的是香气从器皿中升起的样子：上方的植物或香草，下方的盛香器，合在一起，仿佛能看见袅袅的烟缕。它的本义就是香气。古人焚香点茶，庭院里常置一炉，香烟缭绕，是文人日常的雅趣。读这个字，仿佛能闻到草木的芬芳，也让人想起“香远益清”的意境——美好的事物，香气自会飘远。",sources:["《说文解字·香部》","古字形：公版资料 · 本项目示意重绘"]},gong:{title:"规矩之工",body:"古文字的「工」像一把工匠用的曲尺，一横一竖，勾勒出规整的直角。它摹画的是匠人手中丈量天地的工具，也暗示着心中不偏不倚的准则。本义指工巧、工匠，是那些用双手将想象化为实物的人。看到「工」，不妨想起木匠眯眼校直木料的样子——规矩在心，方能成器，这是手艺，也是做人的道理。",sources:["《说文解字·工部》","古字形：公版资料 · 本项目示意重绘"]},li:{title:"筋力之象",body:"甲骨文的“力”字，像一条手臂，中间一竖是筋脉，两侧是绷起的肌肉，仿佛正用力提起重物。本义就是力量、筋力。《说文》说“力，筋也”，正是此意。力从筋生，人的力量来自筋骨。看到这个字，仿佛感受到肌肉紧绷、血脉贲张的瞬间，也让人联想到坚持与担当——力虽无形，却支撑着世间一切劳作与创造。",sources:["《说文解字·力部》","古字形：公版资料 · 本项目示意重绘"]},fei:{title:"展翅凌云",body:"古字形里，飞就像一只展翅的鸟：中间是鸟身，两侧是展开的羽翼，仿佛正要腾空而起。它的本义就是飞翔，指鸟儿振翅升空。飞，是鸟的天性，也是人对天空的向往——从纸鸢到飞机，这个字始终牵着那片云。愿你如飞鸟，心向长空。",sources:["《说文解字·飞部》","古字形：公版资料 · 本项目示意重绘"]},che:{title:"轮转千年",body:"古人造字，俯视一辆双轮马车：两个圆圆的轮子，中间是方方的车厢，前头一根长长的车辕，像一幅小小的俯瞰图。这个字的本义就是“车”，古代最重要的交通工具。如今，它从木轮牛车变成了飞驰的高铁，但那份“载人远行”的初心，从未改变。车轮滚滚，仿佛诉说着人类对远方的向往，也映照着文明前行的轨迹。",sources:["《说文解字·车部》","古字形：公版资料 · 本项目示意重绘"]},wang:{title:"网罗万象",body:"古文字里，“网”像一张用绳线交叉编成的捕猎工具，横竖交织，网眼分明。它的本义就是“网罗”，用来捕鱼捉鸟。如今，这张“网”从渔网变成了互联网，万物流通，尽在一网之中。这让我想到，天地间万物相联，如同网目相扣，彼此依存，生生不息。",sources:["《说文解字·网部》","古字形：公版资料 · 本项目示意重绘"]},jin:{title:"百炼成金",body:"甲骨文里的“金”字，像一块金属锭，下方是箭镞般的锋刃，上方是提柄的孔，整个字形仿佛一枚俯视的箭镞，让人想到金属经过熔炼、锤打，最终成器。它的本义就是金属，古人说“金，五色金也”，泛指各种金属。金从矿石中提炼，历经烈火与锻打，才变得坚韧光亮。这不禁让人联想到，人也如金，需在磨砺中成长，方能绽放光彩。",sources:["《说文解字·金部》","古字形：公版资料 · 本项目示意重绘"]},wei:{title:"城垣环护",body:"这个字像一圈围墙，把中间围起来，保护着里面的珍宝。它的本义就是环绕、围住。古人筑城以护民，这方框就是那城墙的轮廓。如今我们守护文化遗产，也如这字一般，将珍贵之物护在中央，让它们安然传承。",sources:["《说文解字·囗部》","古字形：公版资料 · 本项目示意重绘"]},jiang:{title:"江河之始",body:"甲骨文的“江”字，左边是三滴水点，表示水流，右边是“工”字，既提示读音，也暗合人工疏导的意象。它的本义就是长江，后来泛指大河。你看那水点相连，仿佛江水滔滔、奔流到海，而“工”字像是古人开渠治水留下的印记——水因人而有序，河因工而安流。",sources:["《说文解字·水部》","古字形：公版甲骨资料 · 本项目示意重绘"]},he:{title:"黄河天行",body:"甲骨文的“河”字，左边是流动的水，右边是“可”字——“可”本指一人扛物，这里借音表意，让人联想到人与河流的相依：人依河而居，河因人而名。它的本义指黄河，后泛指河流。你看“可”与“水”并列，仿佛在说：这河水可滋养万物，也可为患，须得敬畏与疏导并重。",sources:["《说文解字·水部》","古字形：公版甲骨资料 · 本项目示意重绘"]},yun:{title:"云气舒卷",body:"古文字里，“云”像上下两片舒卷的云气，彼此回旋、相叠而上，仿佛天地之间正有雾霭升腾。它的本义就是云气。云在天际聚散无常，古人因此借它来说天气、说变化，也说那飘渺远意——云卷云舒里，藏着对自然的敬畏与对远方的想象。",sources:["《说文解字·雨部》","古字形：公版甲骨资料 · 本项目示意重绘"]},jing:{title:"井泉及人",body:"甲骨文的“井”字，是两横两竖构成的井栏之形，中间围成一个方口，像井台的俯视图。它的本义就是水井。井水清冽，养活一方百姓，古人说“改邑不改井”，井已是村落的命脉。看到这个字，会想起井边的辘轳声、邻里汲水的寒暄，以及那句“饮水思源”。",sources:["《说文解字·井部》","古字形：公版甲骨资料 · 本项目示意重绘"]},shi:{title:"磐石之固",body:"甲骨文的“石”字，在“山”的轮廓下加了一个表示山石的口形，仿佛山崖下堆叠的岩石。它的本义就是山石，后泛指一切石头。石乃大地之骨，坚硬而恒久，古人因此以“石”喻坚定，也借它来记音——“石”与“時”古音相近，连带出时间久远之意。",sources:["《说文解字·石部》","古字形：公版甲骨资料 · 本项目示意重绘"]},shi10:{title:"十横贯一",body:"甲骨文的“十”字，就是一竖穿过一横，像一根竖立的筹算，又似东西南北交汇于中心。它的本义就是数字十，也指完备、齐全——所谓“十全十美”，正是这种圆满的表达。一个简单的“十”，古人用它来计数，也用它来表达对完整的追求。",sources:["《说文解字·十部》","古字形：公版甲骨资料 · 本项目示意重绘"]},dong:{title:"日出东方",body:"甲骨文的“东”字，像一个盛满东西的口袋，用绳子束口，两头垂下。它的本义是“东西”的东，指日出的方向。后来这个字被借走，古人便在字形中加上“日”来表示东方，让“日”与“木”相合——太阳从树木间升起，那正是东方的清晨。",sources:["《说文解字·东部》","古字形：公版甲骨资料 · 本项目示意重绘"]},xi:{title:"日落入西",body:"甲骨文的“西”字，像一只鸟儿归巢，翅膀收拢、头朝下，停在巢中。它的本义是“栖”，指鸟儿入巢歇息，后来借用为方向的西——太阳落下的那一方。你看这个字，仿佛还能看见暮色里飞鸟掠过山岗，一一归林的安静。",sources:["《说文解字·西部》","古字形：公版甲骨资料 · 本项目示意重绘"]},zhong:{title:"矢正中的",body:"甲骨文的“中”字，像一根旗杆，上面挂着一面旗子，旗面随风摆动，而旗杆恰好立在正中。它的本义就是中间、不偏不倚。古人说“中也者，天下之大本”，这个字从测量正中而来，后来成为儒家核心——行事合乎中道，不偏不激，方为长久。",sources:["《说文解字·中部》","古字形：公版甲骨资料 · 本项目示意重绘"]}};function By({charId:e,onClose:t}){const n=ut(),r=Rr(e),l=Q(c=>c.notes[e]),i=Q(c=>c.saveNote),o=ci(c=>c.online),[s,u]=j.useState(l??null),[d,g]=j.useState(!l),[p,m]=j.useState("oracle");if(j.useEffect(()=>{if(l){u(l),g(!1);return}if(o===!1){const f=pu[e],h=f?{...f,generatedAt:new Date().toISOString()}:r?{title:`${r.char}字小笺`,body:`${r.etymology}

（离线演示 · 在线版可继续追问）`},{keys:["山"],reply:`三峰并立，中者巍峨，底下一线是大地承之。你登高望过远山么？那便是「山」字的来历。
（离线演示）`},{keys:["水"],reply:`当中一曲是流水奔涌之势，两侧短点，是浪花飞溅。水无常形，字却有骨。
（离线演示）`},{keys:["木"],reply:`一棵树的速写：上为枝，下为根，中有一竖是主干。古人见木而思生息，此字便有了生长的力道。
（离线演示）`},{keys:["火"],reply:`中间是跳动的火苗，两侧是迸溅的火星。火炎而上，与「山」之静正好相对。人类文明，始于一堆篝火。
（离线演示）`},{keys:["人"],reply:`侧面而立的人形，一撇一捺，简洁有力。《说文》说「天地之性最贵者也」——人之所以贵，在于能思能行。
（离线演示）`},{keys:["口"],reply:`方形开口，不是「日」——日中有实，口中是虚。口是言语之所，也是进食之处，一字双关。
（离线演示）`},{keys:["牛"],reply:`正面牛头，双角上翘，中间一竖是鼻梁。牛是古时最大的家畜，《说文》称「大牲也」。祭祀、耕田，皆赖于此。
（离线演示）`},{keys:["雨"],reply:`上方一横是天，框内垂线与点是雨滴。古人观天降雨，便以「一+冂+四点」记之。雨是农人最盼的字。
（离线演示）`},{keys:["明"],reply:`日与月相并，光辉交映，是为「明」。会意者，合二字之象而成新意也。
（离线演示）`},{keys:["林"],reply:`二木为林，树木丛生谓之林。一个人站在林中，便是「休」——停下劳作，倚树歇息。
（离线演示）`},{keys:["休"],reply:`人靠在树旁，便是休息。古人懂得劳逸结合，「休」字本身就是一种生活智慧。
（离线演示）`},{keys:["众"],reply:`三人成众。一个人是「人」，两个人是「从」，三个人便成了「众」。人多力量大，古人早有此悟。
（离线演示）`},{keys:["炎"],reply:`两个火叠在一起，火势更旺。炎者，热也，升也。火上加火，便是烈焰升腾之象。
（离线演示）`},{keys:["造字","文字","创","仓颉","你"],reply:`吾仰观奎星圆曲之势，俯察鸟兽蹄迒之迹，依类象形，故谓之文；形声相益，谓之字。
（离线演示 · 在线版可与我自由长谈）`},{keys:["文字起源","怎么造字","造字原理"],reply:"观物取象，是造字的根本。日出为「日」，月缺为「月」，山高为「山」，水流为「水」。见其形而绘其象，这便是「象形」。"},{keys:["舟","船"],reply:`独木为舟，首尾翘起，中间一横是舱板。共鼓、货狄刳木为舟，剡木为楫，以济不通。舟便是一个渡口，也是一段远行。
（离线演示）`},{keys:["马"],reply:`马头正面，竖鬃四足，《说文》云「怒也，武也」。马是古时的千里足，是边关的铁骑，是「天马行空」的自由。
（离线演示）`},{keys:["门"],reply:`两扇门扉，上方门楣，对称而开。门是家的边界，也是世界的入口。「门内」是家，「门外」是江湖。
（离线演示）`},{keys:["田"],reply:`方块加十字，像纵横阡陌的田亩。《说文》云「树谷曰田」。田是农耕文明的根基，一亩三分地，养活了整个华夏。
（离线演示）`},{keys:["江"],reply:`左水右工，工兼表音。江的本义是长江，后泛指大河。古人依江而居，江水便是命脉。
（离线演示）`},{keys:["河"],reply:`左水右可，可本指一人扛物。河的本义是黄河，母亲河。人依河而居，河因人而名，这便是「河」的深意。
（离线演示）`},{keys:["云"],reply:`上下两片云气，回旋相叠，是「雲」的古文。云在天际聚散无常，古人借它来说天气、说变化、说飘渺。
（离线演示）`},{keys:["井"],reply:`四边框围成方口，像井栏的俯视图。《说文》云「八家一井」。井是村落的命脉，改邑不改井。
（离线演示）`},{keys:["闯"],reply:`门中一马，便是「闯」。马奔出门外，气势如虹。闯荡江湖，始于此字。
（离线演示）`},{keys:["间"],reply:`门中有日，日光从门缝中透入，便是「间」。时间如光，缝隙之间，日月轮转。
（离线演示）`},{keys:["闲"],reply:`门中有木，木倚门框，是门栓之意。闲者，阑也，阻拦之外别有天地。闲庭信步，是宋人的风雅。
（离线演示）`},{keys:["竹"],reply:`两片竹叶相对，左右对称。竹虚心有节，君子比德于竹。古人以竹简载道，一字千钧。
（离线演示）`},{keys:["丝"],reply:`两束丝线绞合，上下各一组。丝是财富，也是羁绊。人生如丝，纠缠难理，不如剪断。
（离线演示）`},{keys:["玉"],reply:`王字加一点，点在右下，表示美石。玉有五德：温润而泽，仁也；栗而理，知也；廉而不刿，义也；垂之如坠，礼也；叩之其声清越，乐也。
（离线演示）`},{keys:["泉"],reply:`从白从水，上白下水，像泉水涌出成川。《说文》云「水原也」。泉是水的起点，也是生命的源头。
（离线演示）`},{keys:["毛"],reply:`毛发上翘之形，上部弯曲如发梢。毛是身体的延伸，也是动物的庇护。春风又绿江南岸，明月何时照我还——月照毛羽，皆是相思。
（离线演示）`},{keys:["香"],reply:`从黍从火，火烧黍米，香气四溢。香是宋人园林的日常：焚香、点茶、挂画、插花。四般闲事，一样不能少。
（离线演示）`},{keys:["笔"],reply:`竹管毛笔，书写千年。笔是文人的剑，纸是战场的纸。一管狼毫，写尽山河万里。
（离线演示）`},{keys:["素"],reply:`素是未经染色的丝，是白纸，是初心。素心若雪，是对繁华最干净的抵抗。
（离线演示）`},{keys:["工"],reply:`上横下横，中间一竖，像工具的轮廓。《说文》云「巧饰也，象人有规榘也」。工是规矩，也是匠心。
